<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>问题</title><link rel="stylesheet" href="../assets/slide.css"><script src="../assets/slide-variant.js"></script></head><body class="paper"><div class="stage"><div class="brand"><img class="fanora" src="../assets/fanora-logo.png"><span class="blend"><i></i></span><img class="monad" src="../assets/monad-logo-light.svg"></div><div class="page">03 / 07</div><section class="headline"><div class="eyebrow">PROBLEM</div><h1 class="title">粉丝一直在付出，价值却在平台切换中消失</h1><p class="subtitle">签到、购买、二创、应援和收藏都在发生，但它们没有形成真正属于用户的长期身份。</p></section><section class="right-visual problem-stack"><div class="card"><b>01 · 分散</b>动态、群聊、图片、交易记录散落在不同平台。</div><div class="card"><b>02 · 不可迁移</b>账号变化后，荣誉、故事和参与历史很难带走。</div><div class="card"><b>03 · 不被理解</b>通用 AI 能画图，却不了解粉丝的长期关系与情感脉络。</div><div class="card"><b>04 · 不可验证</b>传统收藏强调交易，却缺少创作过程和归属证明。</div></section><div class="quote">问题不是粉丝没有贡献，而是这些贡献没有被连接、理解和长期保存。</div><div class="footline"><span>03 · VALUE LEAKAGE</span><span>CONTRIBUTION WITHOUT OWNERSHIP</span></div></div></body></html>
