body{--motion-speed:.95s;--motion-gap:.08s;--data-boost:0;--variant-glow:rgba(116,68,255,.22)}

.dark:after{opacity:.05;mix-blend-mode:screen;background-image:linear-gradient(90deg,rgba(244,241,234,.22) 1px,transparent 1px),linear-gradient(0deg,rgba(244,241,234,.16) 1px,transparent 1px)}
body>*{z-index:1}
.logo,.page,.eyebrow,h1,.subtitle,.footline,p,.memory-card,.intro-flow>*,.fragments span,.fade-id,.loop,.node,.center,.id-screen,.id-path>*,.agent-frame,.agent-points>*,.pipeline>*,.trigger>*,.forge-preview,.scores,.strategy,.fork>*,.credit>*,.publish-pipe>*,.duties>*,.timeline>*,.boundary-cols>*,.split>*,.lit-path>*,.done p,.not-now,.formula,.weights>*,.modes,.nodes>*,.state>*,.contracts>*,.matrix>*,.network,.arch-note,.layers>*{animation:slide-reveal var(--motion-speed) cubic-bezier(.16,.78,.2,1) both;animation-delay:calc(var(--i,0)*var(--motion-gap))}

.intro-flow>*:nth-child(3),.pipeline>*:nth-child(3),.publish-pipe>*:nth-child(3),.timeline>*:nth-child(3),.lit-path>*:nth-child(3),.layers>*:nth-child(3),.matrix>*:nth-child(3){--i:5}
.intro-flow>*:nth-child(n+4),.pipeline>*:nth-child(n+4),.publish-pipe>*:nth-child(n+4),.timeline>*:nth-child(n+4),.lit-path>*:nth-child(n+4),.layers>*:nth-child(n+4),.matrix>*:nth-child(n+4){--i:6}
.scores i,.lit-path i{transform-origin:left center;animation:bar-grow 1.15s cubic-bezier(.18,.78,.18,1) both;animation-delay:calc(.35s + var(--i,0)*.08s)}
.loop:before{content:"";position:absolute;inset:-22px;border-radius:50%;background:conic-gradient(from 250deg,var(--purple),var(--cyan),var(--peach),var(--purple));filter:blur(18px);opacity:.28;animation:spin-slow 18s linear infinite;z-index:-1}
.loop .node,.center,.network,.source{animation-name:slide-reveal,float-soft}
.pipeline i,.publish-pipe i,.nodes i{animation:pulse-arrow 1.8s ease-in-out infinite}
body[data-variant="classic"]{--motion-speed:.75s;--motion-gap:.055s;--data-boost:0}
body[data-variant="motion"]{--motion-speed:1.08s;--motion-gap:.095s;--data-boost:.2}
body[data-variant="data"]{--motion-speed:.92s;--motion-gap:.065s;--data-boost:1}
body[data-variant="data"] .scores,body[data-variant="data"] .layers,body[data-variant="data"] .matrix,body[data-variant="data"] .timeline,body[data-variant="data"] .loop,body[data-variant="data"] .split{filter:drop-shadow(0 28px 45px var(--variant-glow))}
body[data-variant="data"] .node,body[data-variant="data"] .pipeline>div,body[data-variant="data"] .publish-pipe>div,body[data-variant="data"] .timeline>div,body[data-variant="data"] .layers>div,body[data-variant="data"] .matrix>div{outline:1px solid rgba(69,191,239,.28)}
body[data-variant="data"] .scores i,body[data-variant="data"] .lit-path i{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--peach))}
@keyframes slide-reveal{from{opacity:0;transform:translate3d(0,34px,0) scale(.985);filter:blur(8px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes bar-grow{from{transform:scaleX(.02);opacity:.4}to{transform:scaleX(1);opacity:1}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes float-soft{50%{translate:0 -8px}}
@keyframes pulse-arrow{50%{opacity:.45;transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
(function(){
  const key = 'fanora-slide-variant';
  function setVariant(v){
    if (!document.body) return;
    document.body.setAttribute('data-variant', v || localStorage.getItem(key) || 'motion');
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setVariant(); }, { once: true });
  } else {
    setVariant();
  }
  window.addEventListener('message', function(event){
    if(event.data && event.data.type === 'fanora-variant') setVariant(event.data.variant);
  });
})();
