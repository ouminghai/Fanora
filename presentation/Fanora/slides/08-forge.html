body[data-variant="motion"]{--motion-speed:1.08s;--motion-gap:.095s;--data-boost:.2}

@keyframes slide-reveal{from{opacity:0;transform:translate3d(0,34px,0) scale(.985);filter:blur(8px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes bar-grow{from{transform:scaleX(.02);opacity:.4}to{transform:scaleX(1);opacity:1}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes float-soft{50%{translate:0 -8px}}
@keyframes pulse-arrow{50%{opacity:.45;transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

r:var(--peach)}</style>
<script>
(function(){
  const key = 'fanora-slide-variant';
  function setVariant(v){
    if (!document.body) return;
    document.body.setAttribute('data-variant', v || localStorage.getItem(key) || 'motion');
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setVariant(); }, { once: true });
  } else {
    setVariant();
  }
  window.addEventListener('message', function(event){
    if(event.data && event.data.type === 'fanora-variant') setVariant(event.data.variant);
  });
})();
