[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fanora-backend"
version = "0.2.0"
description = "Production-oriented FastAPI and LangGraph backend for Fanora Protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "asgi-correlation-id>=4.3",
  "fastapi>=0.121",
  "greenlet>=3.1",
  "httpx>=0.28",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "pyjwt[crypto]>=2.10",
  "prometheus-client>=0.22",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.8",
  "slowapi>=0.1.9",
  "sqlmodel>=0.0.24",
  "structlog>=25.2",
  "tenacity>=9.1",
  "uvicorn[standard]>=0.34",
  "web3>=7.0",
]

[project.optional-dependencies]
cache = ["redis>=5.2"]
observability = ["langfuse>=3.9"]

[dependency-groups]
dev = [
  "detect-secrets>=1.5",
  "pyright>=1.1.390",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 119
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
include = ["app*"]
